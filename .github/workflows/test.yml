name: SDK tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        openai-spec: ['openai==1.109.1', 'openai']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . '${{ matrix.openai-spec }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q aiwave

  python38:
    name: Python 3.8 lower bound (OpenAI 1.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and test in Python 3.8 container
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo python:3.8.20-slim sh -euc '
            python -m pip install -e . openai==1.109.1
            python -m unittest discover -s tests -v
            python -m compileall -q aiwave
          '
