name: SDK tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        openai-spec: ['openai==1.109.1', 'openai']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . '${{ matrix.openai-spec }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q aiwave
