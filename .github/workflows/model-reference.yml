name: Model reference

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.test_gen_model_reference
      - run: python scripts/gen_model_reference.py --check
