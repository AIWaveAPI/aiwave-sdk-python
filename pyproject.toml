[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiwave"
version = "0.1.0"
description = "AIWave API — One API key for 50+ Chinese AI models (DeepSeek, GLM, Kimi, etc.), OpenAI compatible"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AIWave", email = "support@aiwave.live"}]
keywords = ["ai", "llm", "deepseek", "glm", "kimi", "openai", "api", "chinese-ai", "aiwave"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = ["openai>=1.0.0"]

[project.urls]
Homepage = "https://aiwave.live"
Documentation = "https://aiwave.live"
Repository = "https://github.com/AIWaveAPI/aiwave-sdk-python"
Issues = "https://github.com/AIWaveAPI/aiwave-sdk-python/issues"

[tool.setuptools]
packages = ["aiwave"]
